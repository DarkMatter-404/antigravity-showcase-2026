<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUS Antigravity Hackathon - DarkMatter-404</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.025em;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 24px 0;
    }
    .details {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .detail-val {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Status: Initial Environment Verification Passed ✅</div>
    <h1>Hi NUS Antigravity Hackathon! I am DarkMatter-404</h1>
    <p class="subtitle">NUS MSBA Build with Antigravity Hands-on Lab (2026-11-23)</p>
    
    <div class="divider"></div>

    <div class="details">
      <div class="detail-item">
        <span class="detail-label">Track</span>
        <span class="detail-val">Track 3: HDB Resale</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Student ID</span>
        <span class="detail-val">A0356637R</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Agent</span>
        <span class="detail-val">Antigravity AI</span>
      </div>
    </div>
  </div>
</body>
</html>
